<svg xmlns="http://www.w3.org/2000/svg" width="520" height="620" viewBox="0 0 520 620" role="img" aria-label="TraySymbols tray menu preview">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#111827" flood-opacity=".18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity=".15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="520" height="620" fill="url(#bg)"/>
  <rect x="132" y="70" width="258" height="410" rx="5" fill="#f8fafc" stroke="#8b95a1" filter="url(#shadow)"/>
  <text x="160" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827">TraySymbols</text>
  <line x1="150" y1="124" x2="372" y2="124" stroke="#b8c0cc"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">
    <text x="160" y="151">Manage symbols...</text>
    <text x="160" y="178">About...</text>
    <text x="160" y="205">Open config folder</text>
    <text x="160" y="232">✓ Start with Windows</text>
    <text x="160" y="259">Exit</text>
  </g>
  <line x1="150" y1="282" x2="372" y2="282" stroke="#b8c0cc"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <g fill="#0f172a">
      <text x="166" y="314" text-anchor="middle">·</text>
      <text x="166" y="344" text-anchor="middle">✿</text>
      <text x="166" y="374" text-anchor="middle">❦</text>
      <text x="166" y="404" text-anchor="middle">❧</text>
      <text x="166" y="434" text-anchor="middle">⁂</text>
      <text x="166" y="464" text-anchor="middle">⸺</text>
      <text x="166" y="494" text-anchor="middle">–</text>
      <text x="166" y="524" text-anchor="middle">—</text>
    </g>
    <g fill="#38bdf8">
      <text x="194" y="314" text-anchor="middle">|</text>
      <text x="194" y="344" text-anchor="middle">|</text>
      <text x="194" y="374" text-anchor="middle">|</text>
      <text x="194" y="404" text-anchor="middle">|</text>
      <text x="194" y="434" text-anchor="middle">|</text>
      <text x="194" y="464" text-anchor="middle">|</text>
      <text x="194" y="494" text-anchor="middle">|</text>
      <text x="194" y="524" text-anchor="middle">|</text>
    </g>
    <g fill="#111827">
      <text x="218" y="314">Middle dot</text>
      <text x="218" y="344">Flower</text>
      <text x="218" y="374">Floral heart</text>
      <text x="218" y="404">Fleuron</text>
      <text x="218" y="434">Asterism</text>
      <text x="218" y="464">Two-em dash</text>
      <text x="218" y="494">En dash</text>
      <text x="218" y="524">Em dash</text>
    </g>
  </g>
  <rect x="132" y="540" width="258" height="34" rx="3" fill="#2563eb"/>
  <text x="261" y="562" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff">Copy symbol, paste with Ctrl+V</text>
</svg>
